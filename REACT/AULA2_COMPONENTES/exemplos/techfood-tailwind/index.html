<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFood — Sabor & Saber (Tailwind)</title>
  <link rel="stylesheet" href="output.css">
</head>
<body class="bg-gray-50">

  <!--
    LIVE CODE — PASSO 1: NAVBAR TAILWIND
    No Tailwind não existe navbar pronta.
    Você constrói com flex + justify-between.

    Diferença do Bootstrap:
    Bootstrap: <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
    Tailwind:  <nav class="bg-red-600 text-white px-6 py-4 flex justify-between items-center">

    Versão com hambúrguer requer JS manual (ou biblioteca como AlpineJS).
    Por simplicidade, vamos fazer a versão sem hambúrguer primeiro.
  -->
  <nav class="bg-red-600 text-white px-6 py-4 flex justify-between items-center">
    <span class="font-bold text-xl">Sabor &amp; Saber</span>
    <ul class="flex gap-6 list-none m-0 p-0">
      <li><a href="#cardapio" class="text-white hover:text-red-200 transition-colors">Cardápio</a></li>
      <li><a href="#contato" class="text-white hover:text-red-200 transition-colors">Contato</a></li>
    </ul>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">

    <h2 class="text-center text-2xl font-bold mb-6">Nosso Cardápio</h2>

    <!--
      LIVE CODE — PASSO 2: GRID
      Tailwind: grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4

      No Tailwind o grid fica na section.
      Cada article entra direto — sem col-* nos filhos.
    -->
    <section id="cardapio" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"> 
    </section>

    <hr class="my-8 border-gray-200">

    <!--
      LIVE CODE — PASSO 3: FORM TAILWIND
      Input Tailwind (sem form-control):
        class="w-full border border-gray-300 rounded-lg px-3 py-2
               focus:outline-none focus:ring-2 focus:ring-red-500"

      Label Tailwind:
        class="block text-sm font-medium text-gray-700 mb-1"
    -->
    <section id="contato" class="max-w-lg mx-auto">
      <h2 class="text-center text-2xl font-bold mb-6">Fale conosco</h2>
      <form>
        <div class="mb-4">
          <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Seu nome</label>
          <input type="text"
                 id="nome"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500"
                 placeholder="Nome completo">
        </div>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
          <input type="email"
                 id="email"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500"
                 placeholder="voce@email.com">
        </div>
        <div class="mb-4">
          <label for="mensagem" class="block text-sm font-medium text-gray-700 mb-1">Mensagem</label>
          <textarea id="mensagem"
                    rows="4"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500"
                    placeholder="Sua mensagem..."></textarea>
        </div>
        <button type="submit"
                class="w-full bg-red-600 text-white py-2 rounded-lg font-medium hover:bg-red-700 transition-colors">
          Enviar mensagem
        </button>
      </form>
    </section>

  </main>

  <!--
    LIVE CODE — PASSO 4: MODAL TAILWIND
    Estrutura do modal em HTML que inicia oculta com 'hidden'.
  -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl relative">
      <button onclick="fecharModal()" type="button" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 text-xl font-bold">
        &times;
      </button>
      <h3 id="modalNome" class="text-xl font-bold mb-2">Nome do prato</h3>
      <p id="modalCategoria" class="text-gray-500 text-sm mb-1"></p>
      <p id="modalDescricao" class="text-gray-600 text-sm mb-4"></p>
      <p id="modalPreco" class="text-2xl font-bold text-green-600 mb-6"></p>
      <button type="button" class="w-full bg-red-600 text-white py-2 rounded-lg font-bold hover:bg-red-700 transition-colors">
        Pedir Agora
      </button>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
